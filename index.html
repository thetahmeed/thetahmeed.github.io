<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Under Maintenance | Tahmeedul Islam</title>
    <meta
      name="description"
      content="Tahmeedul Islam’s site is under maintenance and will be back soon."
    />
    <meta name="author" content="Tahmeedul Islam" />
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://tahmeedul.com/" />
    <link rel="icon" href="assets/favicon.ico" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tahmeedul Islam" />
    <meta property="og:title" content="Under Maintenance | Tahmeedul Islam" />
    <meta
      property="og:description"
      content="This site is under maintenance. Back soon."
    />
    <meta property="og:url" content="https://tahmeedul.com/" />

    <meta name="theme-color" content="#0b0f14" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="maintenance-body">
    <main class="maintenance" id="main">
      <div class="maintenance-glow" aria-hidden="true"></div>

      <p class="maintenance-brand">Tahmeedul Islam</p>

      <h1 class="maintenance-title">Under maintenance</h1>
      <p class="maintenance-lead">
        I’m polishing things up and will be back shortly. Thanks for your
        patience.
      </p>

      <section
        class="countdown"
        aria-labelledby="countdown-heading"
        data-target-local="2026-10-15T23:59:00"
      >
        <h2 id="countdown-heading" class="countdown-label">
          Expected back
        </h2>
        <p class="countdown-sublabel" id="countdown-status">
          Tonight at 11:59&nbsp;PM (your local time)
        </p>
        <div class="countdown-clock" role="timer" aria-live="polite">
          <div class="countdown-unit">
            <span class="countdown-value" id="cd-hours">00</span>
            <span class="countdown-unit-label">Hours</span>
          </div>
          <span class="countdown-sep" aria-hidden="true">:</span>
          <div class="countdown-unit">
            <span class="countdown-value" id="cd-minutes">00</span>
            <span class="countdown-unit-label">Minutes</span>
          </div>
          <span class="countdown-sep" aria-hidden="true">:</span>
          <div class="countdown-unit">
            <span class="countdown-value" id="cd-seconds">00</span>
            <span class="countdown-unit-label">Seconds</span>
          </div>
        </div>
      </section>

      <nav class="maintenance-contact" aria-label="Contact">
        <a
          class="contact-link"
          href="https://github.com/thetahmeed"
          target="_blank"
          rel="noopener noreferrer"
        >
          github/thetahmeed
        </a>
        <span class="contact-dot" aria-hidden="true"></span>
        <a class="contact-link" href="mailto:mail@tahmeedul.com">
          mail@tahmeedul.com
        </a>
      </nav>
    </main>

    <script src="script.js"></script>
  </body>
</html>
