<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Under maintenance | Tahmeedul Islam</title>
    <meta
      name="description"
      content="Tahmeedul Islam's site is under maintenance and will be back tonight at 11:59 PM."
    />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="assets/favicon.ico" />
    <meta name="theme-color" content="#0b0f14" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="maintenance">
      <div class="maintenance-card">
        <p class="maintenance-kicker">Tahmeedul Islam</p>
        <h1>Site under maintenance</h1>
        <p class="maintenance-copy">
          This site is being updated and will be back tonight at 11:59 PM.
        </p>
        <div
          class="maintenance-timer"
          role="timer"
          aria-live="polite"
          aria-atomic="true"
          aria-label="Time remaining until the site is back"
        >
          <div>
            <span id="maintenance-hours">00</span>
            <small>Hours</small>
          </div>
          <div>
            <span id="maintenance-minutes">00</span>
            <small>Minutes</small>
          </div>
          <div>
            <span id="maintenance-seconds">00</span>
            <small>Seconds</small>
          </div>
        </div>
        <p class="maintenance-until" id="maintenance-note">
          Countdown to 11:59 PM, 15 October 2026
        </p>
        <div class="maintenance-links">
          <a
            href="https://github.com/thetahmeed"
            target="_blank"
            rel="noreferrer"
            >github.com/thetahmeed</a
          >
          <a href="mailto:mail@tahmeedul.com">mail@tahmeedul.com</a>
        </div>
      </div>
    </main>
    <script>
      (function () {
        var target = new Date("2026-10-15T23:59:00+06:00").getTime();
        var hoursEl = document.getElementById("maintenance-hours");
        var minutesEl = document.getElementById("maintenance-minutes");
        var secondsEl = document.getElementById("maintenance-seconds");
        var noteEl = document.getElementById("maintenance-note");

        var pad = function (value) {
          return String(value).padStart(2, "0");
        };

        var tick = function () {
          var remaining = target - Date.now();
          if (remaining <= 0) {
            hoursEl.textContent = "00";
            minutesEl.textContent = "00";
            secondsEl.textContent = "00";
            noteEl.textContent = "Maintenance window has ended.";
            return;
          }

          var totalSeconds = Math.floor(remaining / 1000);
          hoursEl.textContent = pad(Math.floor(totalSeconds / 3600));
          minutesEl.textContent = pad(Math.floor((totalSeconds % 3600) / 60));
          secondsEl.textContent = pad(totalSeconds % 60);
        };

        tick();
        setInterval(tick, 1000);
      })();
    </script>
  </body>
</html>
